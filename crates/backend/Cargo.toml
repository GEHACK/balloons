[package]
name = "bode-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bode-core = { path = "../core" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
