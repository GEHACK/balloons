syntax = "proto3";

package balloons.v1;

option go_package = "github.com/GEHACK/balloons/gen/balloons/v1;balloonsv1";

service BalloonService {
  rpc ListBalloons(ListBalloonsRequest) returns (ListBalloonsResponse) {}
  rpc StreamBalloons(StreamBalloonsRequest) returns (stream StreamBalloonsResponse) {}
  rpc MarkDone(MarkDoneRequest) returns (MarkDoneResponse) {}
  rpc Reprint(ReprintRequest) returns (ReprintResponse) {}
  rpc MarkPrintJobDone(MarkPrintJobDoneRequest) returns (MarkPrintJobDoneResponse) {}
}

message Balloon {
  int64 id = 1;
  string problem_label = 2;
  string problem_rgb = 3;
  string team_name = 4;
  bool done = 5;
  bool first_solve = 6;
}

// PrintJob is a team print (source code etc.) that went through cuproxy. Its
// cover sheet carries a code128 barcode of "P<id>" so a runner can scan it
// delivered like a balloon ticket.
message PrintJob {
  int64 id = 1;
  string team_name = 2;
  string requesting_ip = 3;
  bool done = 4;
}

message ListBalloonsRequest {}

message ListBalloonsResponse {
  repeated Balloon balloons = 1;
  repeated PrintJob print_jobs = 2;
}

message StreamBalloonsRequest {}

message StreamBalloonsResponse {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADDED = 1;
    KIND_UPDATED = 2;
    KIND_FREEZE = 3;
  }
  Kind kind = 1;
  // ADDED / UPDATED events carry exactly one of balloon or print_job.
  Balloon balloon = 2;
  bool frozen = 3;
  PrintJob print_job = 4;
}

message MarkDoneRequest {
  int64 balloon_id = 1;
}

message MarkDoneResponse {}

message ReprintRequest {
  int64 balloon_id = 1;
}

message ReprintResponse {}

message MarkPrintJobDoneRequest {
  int64 print_job_id = 1;
}

message MarkPrintJobDoneResponse {}
